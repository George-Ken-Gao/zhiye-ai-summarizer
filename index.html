<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7fb">
  <title>知页 — AI 网页摘要</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="知页首页">
        <span class="brand-mark" aria-hidden="true">知</span>
        <span>知页</span>
      </a>
      <span class="topbar-label">AI 网页摘要</span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span> 把长文读短一点</div>
      <h1 id="page-title">让网页重点，<span>一目了然。</span></h1>
      <p class="hero-description">粘贴文章链接，快速提炼核心观点与内容摘要。</p>

      <form class="url-form" id="summary-form">
        <label class="sr-only" for="url-input">网页网址</label>
        <div class="input-wrap">
          <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.07 0l3-3A5 5 0 0 0 13 2.93l-1.72 1.71M14 11a5 5 0 0 0-7.07 0l-3 3A5 5 0 0 0 11 21.07l1.71-1.71" />
          </svg>
          <input
            id="url-input"
            name="url"
            type="url"
            placeholder="粘贴文章网址，例如 https://https://www.wenxuecity.com/"
            autocomplete="url"
            required
          >
          <button class="submit-button" id="submit-button" type="submit">
            <span>生成摘要</span>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 10h12M10 4l6 6-6 6" />
            </svg>
          </button>
        </div>
      </form>
      <p class="privacy-note">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.8 13 4v3.5c0 3.1-2.1 5.4-5 6.7-2.9-1.3-5-3.6-5-6.7V4l5-2.2Z" />
          <path d="m5.8 7.8 1.5 1.5 3-3" />
        </svg>
        网页内容将发送至 Gemini 以生成摘要
      </p>
    </section>

    <section class="result-section" id="result-section" aria-live="polite" aria-busy="false">
      <div class="status-card" id="status-card" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-message">正在处理…</span>
      </div>

      <div class="error-card" id="error-card" role="alert" hidden>
        <span class="error-icon" aria-hidden="true">!</span>
        <div>
          <h2>暂时无法生成摘要</h2>
          <p id="error-message"></p>
        </div>
      </div>

      <article class="summary-card" id="summary-card" hidden>
        <div class="summary-heading">
          <div class="summary-heading-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 4.5h14v15H5zM8 8h8M8 12h8M8 16h5" />
            </svg>
          </div>
          <div>
            <p class="section-kicker">文章摘要</p>
            <h2 id="article-title">摘要结果</h2>
          </div>
        </div>

        <section class="key-points" aria-labelledby="key-points-title">
          <h3 id="key-points-title"><span class="heading-indicator"></span>核心要点</h3>
          <ol id="key-points-list"></ol>
        </section>

        <section class="detailed-summary" aria-labelledby="detailed-summary-title">
          <h3 id="detailed-summary-title"><span class="heading-indicator"></span>详细摘要</h3>
          <p id="detailed-summary-text"></p>
        </section>
        <p class="source-line" id="source-line"></p>
      </article>
    </section>

    <footer class="footer">
      <span>知页 <span class="footer-separator">·</span> 让阅读更轻盈</span>
    </footer>
  </main>
</body>
</html>
